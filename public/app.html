<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الأمن والسلامة</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- الشريط الجانبي -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 id="appName">🛡️ الأمن والسلامة</h2>
        <p>Safety & Security</p>
      </div>
      <ul class="nav-menu" id="navMenu">
        <li class="nav-item active" data-page="dashboard" data-perm="dashboard.view">
          <a href="#dashboard"><span class="nav-icon">📊</span><span data-i18n="dashboard">لوحة التحكم</span></a>
        </li>
        <li class="nav-item" data-page="reports" data-perm="reports.view">
          <a href="#reports"><span class="nav-icon">📋</span><span data-i18n="reports">التقارير</span></a>
        </li>
        <li class="nav-item" data-page="templates" data-perm="templates.view">
          <a href="#templates"><span class="nav-icon">📝</span><span data-i18n="templates">القوالب</span></a>
        </li>
        <li class="nav-item" data-page="departments" data-perm="departments.view">
          <a href="#departments"><span class="nav-icon">🏢</span><span data-i18n="departments">الأقسام</span></a>
        </li>
        <li class="nav-item" data-page="users" data-perm="users.view">
          <a href="#users"><span class="nav-icon">👥</span><span data-i18n="users">المستخدمون</span></a>
        </li>
        <li class="nav-item" data-page="evaluations" data-perm="evaluations.view">
          <a href="#evaluations"><span class="nav-icon">⭐</span><span data-i18n="evaluations">التقييمات</span></a>
        </li>
        <li class="nav-item" data-page="documents" data-perm="templates.view">
          <a href="#documents"><span class="nav-icon">📁</span><span>مكتبة النماذج</span></a>
        </li>
        <li class="nav-section-title">النظام</li>
        <li class="nav-item" data-page="settings" data-perm="settings.view">
          <a href="#settings"><span class="nav-icon">⚙️</span><span data-i18n="settings">الإعدادات</span></a>
        </li>
        <li class="nav-item" data-page="audit" data-perm="audit.view">
          <a href="#audit"><span class="nav-icon">📜</span><span data-i18n="audit_log">سجل التدقيق</span></a>
        </li>
      </ul>
    </aside>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
      <!-- الشريط العلوي -->
      <header class="topbar">
        <div class="flex gap-2">
          <button class="btn btn-ghost menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
          <h1 class="topbar-title" id="pageTitle">لوحة التحكم</h1>
        </div>
        <div class="topbar-actions">
          <div class="lang-switch" style="margin: 0;">
            <button class="btn-lang active" data-lang="ar">ع</button>
            <button class="btn-lang" data-lang="en">EN</button>
          </div>
          <div class="user-menu" id="userMenu">
            <div class="user-avatar" id="userAvatar">A</div>
            <div class="user-info">
              <strong id="userName">-</strong>
              <small id="userRole">-</small>
            </div>
          </div>
          <button class="btn btn-ghost" onclick="logout()" title="خروج">🚪</button>
        </div>
      </header>

      <!-- المحتوى -->
      <main class="content" id="pageContent">
        <div class="empty-state">
          <div class="icon">⏳</div>
          <p>جاري التحميل...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">عنوان</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- مكتبات التعديل المباشر -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages.js"></script>
  <script src="/js/builder.js"></script>
  <script src="/js/documents.js"></script>
</body>
</html>
