app = "safety-app-sa"
primary_region = "dxb"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  UPLOADS_DIR = "/data/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "safety_data"
  destination = "/data"
